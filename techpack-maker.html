<title>Blaze Tech Pack Maker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Inter+Tight:wght@300;500;600;700;800;900&display=swap">
<style>
/* Layout: black brand bar on top; editor column on the left, live A4 pages on the right; stacked with tabs on phones. */
:root{
  --bg:#f1f0ec; --panel:#ffffff; --fg:#151515; --mute:#6f6c66; --line:#e2dfd8; --field:#f7f6f3;
  --accent:#b8202e; --bar:#0d0d0d; --barfg:#ffffff; --ok:#2f7a4b;
  --f-ui:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
  --f-disp:"Inter Tight","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --panel:#1b1b1a; --fg:#f1efea; --mute:#a19d94; --line:#2e2d2a; --field:#232321;
  --accent:#e2505f; --bar:#000000; --barfg:#ffffff; --ok:#5fbf83; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1b1b1a; --fg:#f1efea; --mute:#a19d94; --line:#2e2d2a; --field:#232321;
  --accent:#e2505f; --bar:#000000; --barfg:#ffffff; --ok:#5fbf83; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--barfg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar img{height:30px;display:block}
.bar .ttl{display:flex;flex-direction:column;line-height:1.15}
.bar .ttl b{font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:.01em}
.bar .ttl span{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#9a978f}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:#fff;color:#0d0d0d;border-color:#fff}
.btn.ghost{background:transparent;color:#fff;border-color:#3a3a3a}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
.status{font-size:12px;color:#bdb9b0}

.tabs{display:none}
.wrap{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px;align-items:start}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex;gap:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0}
  .tabs button{flex:1;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
  body[data-tab="edit"] .preview{display:none}
  body[data-tab="preview"] .editor{display:none}
}

/* editor */
.editor{display:flex;flex-direction:column;gap:10px;min-width:0}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:13px 15px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .num{font-size:10.5px;color:var(--accent);font-weight:800;letter-spacing:.08em;width:20px}
details.sec>summary .hint{margin-left:auto;font-weight:500;font-size:12px;color:var(--mute)}
details.sec>summary::after{content:"+";font-weight:500;color:var(--mute);font-size:18px;line-height:1;margin-left:6px}
details.sec[open]>summary::after{content:"–"}
.body{padding:2px 15px 15px;display:flex;flex-direction:column;gap:11px;min-width:0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
label.f{display:flex;flex-direction:column;gap:4px;min-width:0}
label.f>span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
input[type=text],input[type=date],select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 9px;font-size:13.5px;min-width:0}
textarea{resize:vertical;min-height:58px;line-height:1.4}
input[type=color]{width:38px;height:36px;border:1px solid var(--line);border-radius:7px;background:var(--field);padding:2px;cursor:pointer}
.item{border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;flex-direction:column;gap:9px;background:var(--panel)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ihead{display:flex;align-items:center;gap:8px}
.ihead b{font-size:12px;letter-spacing:.06em}
.ihead .x{margin-left:auto}
.add{align-self:flex-start}
.help{font-size:12px;color:var(--mute);line-height:1.45;margin:0}
.imgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.up{position:relative;border:1px dashed var(--line);border-radius:8px;background:var(--field);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;max-width:100%}
.up img{max-width:88%;max-height:80%}
.up .cap{position:absolute;left:6px;bottom:4px;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.up .plus{font-size:20px;color:var(--mute)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up .clr{position:absolute;top:3px;right:3px;border:0;background:var(--panel);border-radius:50%;width:20px;height:20px;font-size:12px;line-height:20px;cursor:pointer;color:var(--mute);z-index:2}
.up.wide{aspect-ratio:auto;height:96px}
.pinpad{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pp{position:relative;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:crosshair}
.pp .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:4px}
.pp .stagep{position:relative}
.pp img{width:100%;display:block;user-select:none;-webkit-user-drag:none}
.pp .dot{position:absolute;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid #fff;pointer-events:none}
.pp .dot.on{outline:2px solid var(--fg);outline-offset:1px}
.meas-grid{overflow-x:auto}
.meas-grid table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.meas-grid th{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700;padding:4px 3px;text-align:center}
.meas-grid td{padding:3px}
.meas-grid input{padding:6px 5px;text-align:center;min-width:44px}
.meas-grid td.nm input{text-align:left;min-width:120px}
.toast{font-size:12.5px;color:var(--ok);font-weight:600}
.err{color:var(--accent)}

/* preview */
.preview{min-width:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:900px){.preview{position:static}}
.pvhead{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute)}
.pvhead b{color:var(--fg);font-size:13px}
.pages{display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - 140px);overflow:auto;padding-bottom:6px}
@media (max-width:900px){.pages{max-height:none;overflow:visible}}
.sheet{position:relative;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.08),0 8px 24px rgba(0,0,0,.08);background:#fff;flex:none}
.sheet>.tp-page{transform-origin:0 0;position:absolute;left:0;top:0}
#exportRoot{position:fixed;left:-20000px;top:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===================== TECH PACK DOCUMENT (always white paper) ===================== */
.tp-page{width:297mm;height:210mm;overflow:hidden;display:flex;flex-direction:column;background:#fff;color:#0d0d0d;font-family:"Inter",sans-serif;font-size:10px;
  --ink:#0d0d0d;--ink2:#2b2b2b;--tmute:#7a7873;--tline:#e4e1db;--tint:#f5f3ef;--red:#b8202e}
.tp-page *{margin:0;padding:0;box-sizing:border-box}
.tp-hd{height:24mm;background:#0d0d0d;color:#fff;display:flex;align-items:center;padding:0 12mm;gap:9mm;flex:none}
.tp-hd .logo{height:12.5mm;width:auto}
.tp-hd .sep{width:1px;height:11mm;background:#3a3a3a}
.tp-hd .doc{display:flex;flex-direction:column;gap:1.4mm}
.tp-k{font-size:6.5pt;letter-spacing:.3em;color:#9a978f;text-transform:uppercase;font-weight:500}
.tp-hd .t{font-family:"Inter Tight","Inter",sans-serif;font-size:15pt;font-weight:600}
.tp-hd .right{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:1.4mm}
.tp-hd .right .t{font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.tp-strip{display:flex;border-bottom:1px solid var(--tline);margin:0 12mm;flex:none}
.tp-strip>div{padding:3mm 3mm 2.8mm;border-right:1px solid var(--tline);flex:1 1 0;min-width:0}
.tp-strip>div:first-child{padding-left:0}
.tp-strip>div:last-child{border-right:0;flex:1.7 1 0}
.tp-strip>div.w{flex:1.5 1 0}
.tp-lab{font-size:5.8pt;letter-spacing:.2em;text-transform:uppercase;color:var(--tmute);font-weight:600;margin-bottom:1.3mm;white-space:nowrap}
.tp-val{font-size:8.4pt;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tp-sizes{display:flex;gap:1.1mm;flex-wrap:nowrap}
.tp-sizes span{font-size:7.2pt;font-weight:600;color:#9b988f;padding:.3mm 1.2mm;border-radius:1mm}
.tp-sizes span.on{background:#0d0d0d;color:#fff}
.tp-bd{flex:1;padding:5mm 12mm 0;display:flex;gap:6mm;min-height:0}
.tp-col{display:flex;flex-direction:column;gap:5mm;min-width:0;min-height:0}
.tp-sec{display:flex;align-items:center;gap:3mm;margin-bottom:3mm}
.tp-sec .n{font-size:6.5pt;font-weight:700;color:var(--red);letter-spacing:.1em}
.tp-sec .h{font-family:"Inter Tight","Inter",sans-serif;font-size:10.5pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.tp-sec .rule{flex:1;height:1px;background:var(--tline)}
.tp-ft{height:12mm;margin:0 12mm;border-top:1px solid var(--tline);display:flex;align-items:center;gap:4mm;font-size:6.6pt;color:var(--tmute);letter-spacing:.06em;flex:none}
.tp-ft .flogo{height:5mm;width:auto}
.tp-ft .pg{margin-left:auto;font-weight:600;color:#0d0d0d;letter-spacing:.16em}
.tp-ft .dot{width:1mm;height:1mm;border-radius:50%;background:#c9c5bd}

.tp-cw{display:flex;flex-direction:column;gap:4mm;flex:1;min-height:0}
.tp-cwrow{flex:1 1 0;min-height:0;display:flex;align-items:center;gap:5mm;background:var(--tint);border-radius:2.2mm;padding:4mm 6mm}
.tp-cwmeta{width:30mm;flex:none}
.tp-cwmeta .no{font-family:"Inter Tight","Inter",sans-serif;font-size:22pt;font-weight:300;color:#bdb8ae;line-height:1}
.tp-cwmeta .nm{font-size:10pt;font-weight:700;margin-top:2mm;letter-spacing:.06em;text-transform:uppercase}
.tp-cwmeta .sw{display:flex;align-items:center;gap:2mm;margin-top:2.4mm;font-size:6.8pt;color:var(--tmute);line-height:1.3}
.tp-cwmeta .chip{width:5mm;height:5mm;border-radius:50%;border:1px solid rgba(0,0,0,.12);flex:none}
.tp-cwmeta .tag{display:inline-block;margin-top:3mm;font-size:6pt;letter-spacing:.16em;text-transform:uppercase;font-weight:600;border:1px solid #cfcac1;border-radius:5mm;padding:.8mm 2.2mm;color:var(--ink2);white-space:nowrap}
.tp-flats{flex:1;display:flex;align-items:flex-end;justify-content:space-around;height:100%;gap:3mm;min-width:0}
.tp-flats figure{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:1.8mm;height:100%;min-width:0}
.tp-flats .imgbox{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.tp-flats img{max-height:100%;max-width:100%;width:auto;height:auto}
.tp-flats figcaption,.tp-cap{font-size:5.8pt;letter-spacing:.24em;text-transform:uppercase;color:var(--tmute);font-weight:600}
.tp-empty{font-size:6.5pt;color:#b4afa5;letter-spacing:.1em;text-transform:uppercase}
.tp-kv{display:grid;grid-template-columns:24mm 1fr;row-gap:2.5mm;column-gap:3mm}
.tp-kv .k{font-size:6pt;letter-spacing:.18em;text-transform:uppercase;color:var(--tmute);font-weight:600;padding-top:.6mm}
.tp-kv .v{font-size:8.1pt;font-weight:500;line-height:1.35}
.tp-tbl{width:100%;border-collapse:collapse}
.tp-tbl th{font-size:5.8pt;letter-spacing:.16em;text-transform:uppercase;color:var(--tmute);text-align:left;font-weight:600;padding:0 2mm 1.8mm 0;border-bottom:1px solid #0d0d0d}
.tp-tbl td{font-size:7.3pt;padding:2mm 2mm 2mm 0;border-bottom:1px solid var(--tline);vertical-align:top;line-height:1.3;color:var(--ink2)}
.tp-tbl td.b{font-weight:700;color:#0d0d0d}
.tp-tbl td.m{color:var(--tmute);font-size:6.8pt}

.tp-views{display:flex;gap:5mm;flex:1;min-height:0}
.tp-view{flex:1 1 0;min-width:0;background:var(--tint);border-radius:2.2mm;padding:4mm;display:flex;flex-direction:column;min-height:0}
.tp-view .vl{display:flex;justify-content:space-between}
.tp-stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tp-stage .wrapimg{position:relative;max-width:100%;max-height:100%}
.tp-stage img{display:block;max-width:100%;max-height:72mm}
.tp-pin{position:absolute;width:6.4mm;height:6.4mm;margin:-3.2mm 0 0 -3.2mm;border-radius:50%;background:var(--red);color:#fff;font-size:7pt;font-weight:700;display:flex;align-items:center;justify-content:center;border:1.1mm solid rgba(255,255,255,.88)}
.tp-cos{display:flex;flex-direction:column;gap:2.2mm;margin-top:3mm}
.tp-co{display:flex;gap:2.4mm;align-items:flex-start}
.tp-co .b{width:5mm;height:5mm;border-radius:50%;background:var(--red);color:#fff;font-size:6.3pt;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.tp-co .t{font-size:7.3pt;font-weight:700;line-height:1.25}
.tp-co .s{font-size:6.5pt;color:var(--tmute);line-height:1.35;margin-top:.4mm}
.tp-art{display:grid;grid-template-columns:1fr 1fr;gap:4mm}
.tp-ac{background:#fff;border:1px solid var(--tline);border-radius:2.2mm;overflow:hidden}
.tp-ac .pv{height:25mm;display:flex;align-items:center;justify-content:center;overflow:hidden}
.tp-ac .pv img{max-width:100%;max-height:100%}
.tp-ac .meta{padding:2.5mm 3mm 2.8mm}
.tp-ac .meta .t{font-size:7.5pt;font-weight:700}
.tp-ac .meta .s{font-size:6.3pt;color:var(--tmute);margin-top:.8mm;line-height:1.35}

.tp-meas{background:var(--tint);border-radius:2.2mm;padding:4mm;display:flex;flex-direction:column;flex:1;min-height:0}
.tp-meas .stg{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.tp-meas img{max-width:100%;max-height:110mm}
.tp-spec{width:100%;border-collapse:collapse}
.tp-spec th{font-size:6pt;letter-spacing:.14em;text-transform:uppercase;color:var(--tmute);font-weight:600;padding:1mm 0 1.8mm;border-bottom:1px solid #0d0d0d;text-align:center}
.tp-spec th.l{text-align:left}
.tp-spec td{font-size:8pt;padding:1.5mm 0;border-bottom:1px solid var(--tline);text-align:center;font-weight:500}
.tp-spec td.poi{width:8mm}
.tp-spec td.poi span{display:inline-flex;width:5.4mm;height:5.4mm;border-radius:50%;background:#0d0d0d;color:#fff;font-size:6.6pt;font-weight:700;align-items:center;justify-content:center}
.tp-spec td.nm{text-align:left;font-weight:600}
.tp-spec td.nm small{display:block;font-weight:400;color:var(--tmute);font-size:6.2pt;margin-top:.4mm}
.tp-spec td.na{color:#cdc8be}
.tp-spec td.hl{background:#efece6;font-weight:800}
.tp-spec th.hl{background:#0d0d0d;color:#fff;border-radius:1.2mm 1.2mm 0 0}
.tp-spec td.tol{color:var(--tmute);font-size:7pt}
.tp-note{font-size:6.4pt;color:var(--tmute);margin-top:2.2mm}
.tp-g3{display:flex;gap:4mm}
.tp-g3>div{flex:1 1 0;min-width:0}
.tp-g3>div.w{flex:1.25 1 0}
.tp-sw{display:flex;gap:3mm;align-items:center;margin-bottom:1.8mm}
.tp-sw .c{width:8mm;height:8mm;border-radius:1.6mm;flex:none;border:1px solid rgba(0,0,0,.08)}
.tp-sw .t{font-size:7.5pt;font-weight:700}
.tp-sw .s{font-size:6.3pt;color:var(--tmute);margin-top:.4mm}
.tp-mini{font-size:6.6pt;color:var(--ink2);line-height:1.45;white-space:pre-line}
.tp-tag{height:14mm;border-radius:1.4mm;background:#fff;border:1px solid #d8d4cc;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:2.2mm;overflow:hidden}
.tp-tag img{max-height:100%;max-width:100%}
.tp-tag .w1{font-family:"Inter Tight","Inter",sans-serif;font-weight:800;font-size:8.5pt;letter-spacing:.12em;line-height:1;text-transform:uppercase}
.tp-tag .sz{font-size:7pt;font-weight:700;margin-top:1.2mm}
.tp-notes{display:grid;grid-template-columns:1fr 1fr;column-gap:6mm;row-gap:1.6mm}
.tp-notes div{display:flex;gap:2mm;font-size:7.1pt;line-height:1.35;color:var(--ink2)}
.tp-notes div i{font-style:normal;font-size:6pt;font-weight:700;color:var(--red);padding-top:.5mm;width:4mm;flex:none}
.tp-sign{display:flex;gap:4mm;margin-top:auto;padding-bottom:4mm}
.tp-sign div{flex:1;border-top:1px solid #0d0d0d;padding-top:1.4mm;margin-top:6mm;font-size:5.6pt;letter-spacing:.18em;text-transform:uppercase;color:var(--tmute);font-weight:600}
</style>

<header class="bar">
  <img id="barLogo" alt="Blaze Impex">
  <div class="ttl"><span>Blaze Impex</span><b>Tech Pack Maker</b></div>
  <div class="sp"></div>
  <span class="status" id="status"></span>
  <button class="btn ghost" id="btnNew" type="button">New tech pack</button>
  <button class="btn pri" id="btnPdf" type="button">Download PDF</button>
</header>
<div class="tabs" role="tablist">
  <button type="button" role="tab" id="tabEdit" aria-selected="true">Edit</button>
  <button type="button" role="tab" id="tabPrev" aria-selected="false">Preview</button>
</div>
<div class="wrap">
  <div class="editor" id="editor"></div>
  <div class="preview">
    <div class="pvhead"><b>Preview</b><span>A4 landscape · 3 pages · updates as you type</span></div>
    <div class="pages" id="pages"></div>
  </div>
</div>
<div id="exportRoot" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  return `<div class="tp-view"><div class="vl"><span class="tp-cap">${which==="front"?"Front":"Back"}</span><span class="tp-cap">${nums.length?two(Math.min(...nums))+(nums.length>1?" — "+two(Math.max(...nums)):""):""}</span></div>

   <div class="tp-cos">${items.map(p=>`<div class="tp-co"><span class="b">${p.i+1}</span><div><div class="t">${esc(p.title||"—")}</div>${p.desc?`<div class="s">${esc(p.desc)}</div>`:""}</div></div>`).join("")}</div></div>`;

const pagesEl=document.getElementById("pages");
let pvTimer;
function renderPreview(){
  pagesEl.innerHTML=[page1(),page2(),page3()].map(h=>`<div class="sheet">${h}</div>`).join("");

}
function fit(){
  const w=pagesEl.clientWidth-2; if(w<=0)return;
  const pw=297*96/25.4, ph=210*96/25.4, s=w/pw;
  pagesEl.querySelectorAll(".sheet").forEach(sh=>{sh.style.width=w+"px";sh.style.height=(ph*s)+"px";sh.firstElementChild.style.transform=`scale(${s})`});
}
window.addEventListener("resize",fit);
function changed(){clearTimeout(pvTimer);pvTimer=setTimeout(()=>{renderPreview();save()},180)}

      ${src?S.poi.map((p,i)=>p.view===v?`<span class="dot ${i===poiSel?"on":""}" style="left:${p.x}%;top:${p.y}%">${i+1}</span>`:"").join(""):""}</div></div>`}).join("")}</div>
    ${S.poi.map((p,i)=>`<div class="item ${i===poiSel?"sel":""}" data-poisel="${i}"><div class="ihead"><b>CALLOUT ${i+1}</b>

const blanks={summary:()=>({k:"",v:""}),revisions:()=>({rev:two(S.revisions.length),date:"",text:""}),
  colourways:()=>({name:"",hex:"#888888",note:"",tag:"",front:"",back:"",side:""}),
  poi:()=>({view:"front",x:50,y:50,title:"",desc:""}),art:()=>({img:"",title:"",spec:""}),
  bom:()=>({item:"",desc:"",colour:"",place:""}),"meas.rows":()=>({l:String.fromCharCode(65+S.meas.rows.length),name:"",how:"",vals:{}}),
  colours:()=>({hex:"#888888",name:"",note:""}),notes:()=>""};

ed.addEventListener("input",e=>{
  const k=e.target.dataset.k; if(!k)return;
  setP(S,k,e.target.value);
  if(e.target.dataset.re||k==="meta.sizes"){ if(k==="meta.sizes"&&!sizes().includes(S.meta.sample)) S.meta.sample=sizes()[0]||""; }
  if(e.target.dataset.re) renderEditor();
  changed();
});
ed.addEventListener("change",e=>{ if(e.target.dataset.k==="meta.sizes"){renderEditor()} });
ed.addEventListener("toggle",e=>{const d=e.target;if(!d.dataset||!d.dataset.sec)return;d.open?open.add(d.dataset.sec):open.delete(d.dataset.sec);try{localStorage.setItem(KEY+"-open",JSON.stringify([...open]))}catch(_){}} ,true);
ed.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(b){
    const list=b.dataset.list, arr=list?getP(S,list):null;
    if(b.dataset.act==="add"){arr.push(blanks[list]()); if(list==="poi")poiSel=arr.length-1}
    if(b.dataset.act==="del"){arr.splice(+b.dataset.i,1); if(list==="poi")poiSel=Math.max(0,Math.min(poiSel,arr.length-1))}
    if(b.dataset.act==="clear"){e.preventDefault();setP(S,b.dataset.k,"")}
    renderEditor();changed();return;
  }
  const pad=e.target.closest("[data-pad]");
  if(pad){const im=pad.querySelector("img");if(!im||!S.poi[poiSel])return;const r=im.getBoundingClientRect();
    const x=Math.round((e.clientX-r.left)/r.width*1000)/10,y=Math.round((e.clientY-r.top)/r.height*1000)/10;
    if(x<0||x>100||y<0||y>100)return;Object.assign(S.poi[poiSel],{view:pad.dataset.pad,x,y});renderEditor();changed();return}
  const it=e.target.closest("[data-poisel]");
  if(it&&+it.dataset.poisel!==poiSel){poiSel=+it.dataset.poisel;const keep=document.activeElement?.id;renderEditor();if(keep)document.getElementById(keep)?.focus()}
});
ed.addEventListener("change",e=>{
  const p=e.target.dataset.up; if(!p||!e.target.files[0])return;
  const f=e.target.files[0], rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const max=1400,sc=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement("canvas");
    cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
    const png=/png|gif|webp|svg/.test(f.type);setP(S,p,png?cv.toDataURL("image/png"):cv.toDataURL("image/jpeg",.9));renderEditor();changed()};
    im.onerror=()=>{saveMsg.textContent="That file could not be read as an image. Try a JPG or PNG."};im.src=rd.result};
  rd.readAsDataURL(f);
});

let downloads=null;
const btnPdf=document.getElementById("btnPdf");
(async()=>{try{downloads=await window.claude?.use?.("downloads")}catch(e){downloads=null}
  if(!downloads){btnPdf.title="Downloads are available when this page is opened in Claude"}})();

  if(!downloads){saveMsg.textContent="Downloading isn't available in this view. Open the page in Claude to save the PDF.";return}
  btnPdf.disabled=true;const old=btnPdf.textContent;btnPdf.textContent="Building PDF…";
  try{
    const root=document.getElementById("exportRoot");root.innerHTML=docHTML();
    await document.fonts.ready;
    await Promise.all([...root.querySelectorAll("img")].map(i=>i.decode?i.decode().catch(()=>{}):null));
    const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:"landscape",unit:"mm",format:"a4",compress:true});
    const pages=[...root.querySelectorAll(".tp-page")];
    for(let i=0;i<pages.length;i++){
      btnPdf.textContent=`Building page ${i+1} of 3…`;
      const cv=await html2canvas(pages[i],{scale:2.4,backgroundColor:"#ffffff",logging:false,useCORS:true});
      if(i)pdf.addPage("a4","landscape");
      pdf.addImage(cv.toDataURL("image/jpeg",.92),"JPEG",0,0,297,210,undefined,"FAST");
    }
    root.innerHTML="";
    const name=((S.meta.styleName||"Tech pack")+" "+(S.meta.styleNo||"")).trim().replace(/[\\/:*?"<>|]+/g,"")+" - Tech Pack.pdf";
    await downloads.save({filename:name,data:pdf.output("blob")});
    saveMsg.textContent="PDF saved";
  }catch(err){
    const c=err&&err.code;
    saveMsg.textContent=c==="declined"?"Download cancelled":c==="rate_limited"?"A save is already waiting. Try again in a moment.":"The PDF could not be made. Try again, or use smaller images.";
  }finally{btnPdf.disabled=false;btnPdf.textContent=old}
});

renderEditor();renderPreview();
if(document.fonts)document.fonts.ready.then(fit);
</script>
